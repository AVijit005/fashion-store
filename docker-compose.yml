version: '3.8'

services:
  # -----------------------------------------------------
  # 🌐 Frontend (TanStack Start + React 19)
  # -----------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
    container_name: aura-frontend
    restart: unless-stopped
    ports:
      - '8080:80' # Expose production frontend
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------
  # ⚙️ Backend (NestJS + Prisma)
  # -----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aura_db?schema=public&connection_limit=20&pool_timeout=30&statement_timeout=15000&lock_timeout=5000}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:8080,http://localhost:5173}
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-aura-studio}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Phase 6 fix: probe /health (deep DB+Redis check) not / (just the
      # "is live" string). Orchestrators now flag a replica unhealthy
      # when DB or Redis is failing, not only when the process is dead.
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------
  # 🗄️ PostgreSQL Database
  # -----------------------------------------------------
  postgres:
    image: postgres:15.7-alpine
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # -----------------------------------------------------
  # ⚡ Redis Cache & Queues
  # -----------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: aura-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

  # -----------------------------------------------------
  # 🪣 MinIO (S3 Compatible Storage)
  # -----------------------------------------------------
  minio:
    # Pinned to a specific release so a future MinIO breaking change cannot
    # silently corrupt production data.
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: aura-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - miniodata:/data

  # -----------------------------------------------------
  # 👷 Background Worker (Phase 6)
  # -----------------------------------------------------
  # Runs BullMQ consumers (order-expiry queue) and @Cron jobs
  # (AbandonedCartCron, PaymentPendingReconciliationCron). Only ONE
  # replica should run — scaling the API does NOT scale workers.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-worker
    restart: unless-stopped
    profiles: ["workers"]  # opt-in: `docker compose --profile workers up`
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      RUN_WORKERS: 'true'
      SENTRY_DSN: ${SENTRY_DSN:-}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-aura-studio}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    command: ["node", "dist/worker.js"]
    healthcheck:
      # Worker has no HTTP port, but we still want a liveness signal.
      # Probe the BullMQ queue length via redis-cli as a weak proxy
      # for "the worker is still subscribed to jobs".
      test: ["CMD-SHELL", "redis-cli -h redis LLEN bull:order-expiry:wait || exit 0"]
      interval: 60s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------
  # 💾 Daily Postgres Backup → S3
  # -----------------------------------------------------
  # Runs at 02:00 UTC daily. Streams pg_dump straight to S3 (no local disk
  # usage) and prunes dumps older than BACKUP_RETENTION_DAYS (default 30).
  #
  # Requires: BACKUP_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  # AWS_REGION env vars on the host.
  backup:
    image: postgres:15.7-alpine
    container_name: aura-backup
    restart: unless-stopped
    profiles: ["backup"]   # opt-in: `docker compose --profile backup up`
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_BUCKET_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_BUCKET_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY}}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./backend/scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache aws-cli >/dev/null && \
        echo "0 2 * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root && \
        crond -f -L /var/log/cron.log

volumes:
  pgdata:
  redisdata:
  miniodata:
