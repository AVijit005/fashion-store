name: Aura Streetwear CI

# Phase 7 rewrite:
# - bump all actions to v4
# - add concurrency control so queued pushes cancel superseded runs
# - add explicit `permissions:` block (least-privilege by default)
# - split into focused jobs: lint+typecheck, backend test, frontend test,
#   schema-diff, docker build+push, deploy
# - docker jobs push images to GHCR with `sha-${{ github.sha }}` tags
# - deploy job uses OIDC to assume a cloud role (no long-lived secrets)
# - npm audit failures now fail the build (no more `|| true`)
# - cache npm + bun install for faster runs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; each job opts in to what it needs.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Fast feedback: lint + typecheck for both apps. Runs first so the
  # developer sees obvious mistakes within ~60 seconds.
  # ---------------------------------------------------------------------
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install Frontend Deps
        run: bun install --frozen-lockfile

      - name: Frontend Lint
        run: bun run lint

      - name: Frontend Typecheck
        run: bun run typecheck

      - name: Setup Node (Backend)
        uses: actions/setup-node@v6
        with:
          node-version: '20.18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Deps
        working-directory: ./backend
        run: npm ci

      - name: Backend Lint
        working-directory: ./backend
        run: npm run lint

      - name: Backend Typecheck
        working-directory: ./backend
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------
  # Backend tests with real Postgres + Redis sidecars.
  # ---------------------------------------------------------------------
  backend-test:
    name: Backend Tests (Unit + E2E)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura_password
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aura:aura_password@localhost:5432/aura_test?schema=public&connection_limit=20&pool_timeout=30&statement_timeout=15000&lock_timeout=5000
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci_dummy_jwt_secret_that_is_at_least_32_chars_long
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 7
      PORT: 3000
      FRONTEND_ORIGINS: http://localhost:5173
      RAZORPAY_KEY_ID: rzp_test_ci_dummy_key_id_12345678
      RAZORPAY_KEY_SECRET: CHANGEME_ci_dummy_key_secret_32_chars
      RAZORPAY_WEBHOOK_SECRET: CHANGEME_ci_dummy_webhook_secret_32
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7CIEXAMPLEX
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: aura-test-bucket
      AWS_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Deps
        working-directory: ./backend
        run: npm ci

      - name: Apply Prisma migrations
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Security Audit (fail on high)
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: Run Unit Tests
        working-directory: ./backend
        run: npm test -- --coverage

      - name: Run E2E Tests
        working-directory: ./backend
        run: npx prisma migrate reset --force --skip-seed && npm run test:e2e

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage

  # ---------------------------------------------------------------------
  # Frontend tests. Currently just build + typecheck (no test suite yet).
  # Phase 9 follow-up: add vitest + Playwright.
  # ---------------------------------------------------------------------
  frontend-test:
    name: Frontend Build + Typecheck
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install Frontend Deps
        run: bun install --frozen-lockfile

      - name: Build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_SITE_URL: http://localhost:5173
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: .vercel/output/static
          retention-days: 7

  # ---------------------------------------------------------------------
  # Schema validation: catches `schema.prisma` edits that didn't include
  # a matching migration. Runs on every PR.
  # ---------------------------------------------------------------------
  schema-diff:
    name: Prisma Schema Diff
    runs-on: ubuntu-latest
    needs: lint-typecheck
    env:
      # Use the same shadow-database URL pattern as the test job.
      DATABASE_URL: postgresql://aura:aura_password@localhost:5432/aura_test?schema=public
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura_password
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Deps
        working-directory: ./backend
        run: npm ci

      - name: Verify schema.prisma matches migrations
        working-directory: ./backend
        run: |
          DIFF=$(npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" 2>&1)
          if [ -n "$DIFF" ] && ! echo "$DIFF" | grep -q "No difference"; then
            echo "::error::schema.prisma has uncommitted changes. Run \`npx prisma migrate dev\` and commit the migration."
            echo "$DIFF"
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Build Docker images and push to GHCR. Only runs on main (PRs get
  # a build but no push). Tags include the SHA and "latest" for main.
  # ---------------------------------------------------------------------
  docker:
    name: Build + Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, schema-diff]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build + push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aura-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aura-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build + push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aura-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aura-frontend:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SITE_URL=${{ secrets.VITE_SITE_URL }}
            VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ---------------------------------------------------------------------
  # Deploy to production. Uses OIDC to assume a cloud role (AWS/GCP/
  # Azure) so we never store long-lived secrets in GitHub.
  #
  # Required secrets (configure once in repo Settings > Secrets):
  #   AWS_DEPLOY_ROLE  -- OIDC role ARN with ECS/EKS deploy permissions
  #   AWS_REGION       -- e.g. ap-south-1
  #
  # Required variables:
  #   VITE_API_URL, VITE_SITE_URL, VITE_RAZORPAY_KEY_ID, VITE_SENTRY_DSN
  #   (used at frontend image build time, see `docker` job)
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://aurastreetwear.com
    permissions:
      contents: read
      packages: read
      id-token: write   # required for OIDC
    steps:
      - uses: actions/checkout@v4

      # Configure AWS credentials via OIDC. The role's trust policy must
      # allow the repo + branch. See DEPLOY.md (Phase 10).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Force ECS services to pick up the new image. Adapts to ECS by
      # default; for EKS / Docker Swarm / Nomad swap this step for the
      # appropriate rollout command.
      - name: Roll out backend
        run: |
          aws ecs update-service \
            --cluster aura \
            --service aura-backend \
            --force-new-deployment

      - name: Roll out worker
        run: |
          aws ecs update-service \
            --cluster aura \
            --service aura-worker \
            --force-new-deployment

      - name: Roll out frontend
        run: |
          aws ecs update-service \
            --cluster aura \
            --service aura-frontend \
            --force-new-deployment

      # Smoke test: hit the production health endpoint and verify it
      # returns 200 with status:ok.
      - name: Smoke test
        run: |
          sleep 30  # allow ECS to converge
          for i in 1 2 3 4 5; do
            if curl -sf "${{ secrets.VITE_SITE_URL }}/healthz"; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 5 attempts"
          exit 1
