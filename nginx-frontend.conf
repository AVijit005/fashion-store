# Production nginx config for the TanStack Start / Nitro frontend.
#
# Served from nginxinc/nginx-unprivileged on port 8080 (non-root). Designed to
# sit behind a managed reverse proxy (Cloudflare / AWS ALB) that terminates
# TLS; if you expose this directly, add an SSL server block.
#
# Responsibilities:
#   1. SPA fallback — every non-asset path serves /index.html so TanStack
#      Router can handle client-side routes (/cart, /admin/orders, etc.)
#   2. Send security headers (HSTS, CSP, X-Frame-Options, X-Content-Type-Options)
#   3. Enable gzip for text payloads
#   4. Long-cache hashed assets under /assets/
#   5. Expose /healthz for container healthchecks

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # ---------- gzip ----------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  # ---------- security headers ----------
  # HSTS is only meaningful over HTTPS — the managed reverse proxy is
  # expected to forward the original scheme. We send it unconditionally;
  # browsers ignore it on plain HTTP.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self \"https://checkout.razorpay.com\")" always;

  # CSP — keep conservative; if you add new image hosts or analytics, extend here.
  # 'unsafe-inline' on style-src is required by Tailwind's runtime injection.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://*.sentry.io https://*.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://*.sentry.io https://*.google-analytics.com https://*.analytics.google.com; frame-src https://checkout.razorpay.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self' https://checkout.razorpay.com; frame-ancestors 'none'" always;

  # ---------- healthcheck ----------
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # ---------- immutable caching for Vite-hashed assets ----------
  # TanStack Start / Vite emit /assets/<hash>-<name> files at build time.
  # These are content-addressed, so they can be cached forever.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ---------- robots / sitemap (don't SPA-fallback these) ----------
  location = /robots.txt { try_files $uri =404; }
  location = /sitemap.xml { try_files $uri =404; }

  # ---------- SPA fallback ----------
  # Every other path falls through to index.html so TanStack Router can
  # handle the route on the client.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ---------- hidden files ----------
  location ~ /\. { deny all; access_log off; log_not_found off; }
}
